spring:
  application:
    name: sovmestim-gateway
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5437/sovmestim_gateway}
    username: ${SPRING_DATASOURCE_USERNAME:sovmestim}
    password: ${SPRING_DATASOURCE_PASSWORD:sovmestim}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Kubernetes probes: liveness ignores the database, readiness requires it.
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    url: /openapi.yaml
    disable-swagger-default-url: true

sovmestim:
  jwt:
    secret: ${SOVMESTIM_JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    issuer: ${SOVMESTIM_JWT_ISSUER:sovmestim}
    access-ttl: PT15M
    refresh-ttl: P30D
  grpc:
    clients:
      identity:
        host: ${SOVMESTIM_IDENTITY_GRPC_HOST:localhost}
        port: ${SOVMESTIM_IDENTITY_GRPC_PORT:9091}
      patient:
        host: ${SOVMESTIM_PATIENT_GRPC_HOST:localhost}
        port: ${SOVMESTIM_PATIENT_GRPC_PORT:9092}
      catalog:
        host: ${SOVMESTIM_CATALOG_GRPC_HOST:localhost}
        port: ${SOVMESTIM_CATALOG_GRPC_PORT:9093}
      intake:
        host: ${SOVMESTIM_INTAKE_GRPC_HOST:localhost}
        port: ${SOVMESTIM_INTAKE_GRPC_PORT:9094}
      advice:
        host: ${SOVMESTIM_ADVICE_GRPC_HOST:localhost}
        port: ${SOVMESTIM_ADVICE_GRPC_PORT:9095}
