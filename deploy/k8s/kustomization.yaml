apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sovmestim
resources:
  - namespace.yaml
  - secrets.yaml
  - configmaps.yaml
  - postgres.yaml
  - apps/identity.yaml
  - apps/patient.yaml
  - apps/catalog.yaml
  - apps/intake.yaml
  - apps/advice.yaml
  - apps/gateway.yaml
  - networkpolicies.yaml
  - ingress.yaml
# Single place to change the deployed tag: kustomize edit set image or edit this list.
images:
  - name: sovmestim-identity
    newTag: "0.2.0"
  - name: sovmestim-patient
    newTag: "0.2.0"
  - name: sovmestim-catalog
    newTag: "0.2.0"
  - name: sovmestim-intake
    newTag: "0.2.0"
  - name: sovmestim-advice
    newTag: "0.2.0"
  - name: sovmestim-gateway
    newTag: "0.2.0"
