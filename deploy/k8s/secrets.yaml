# Development/demo credentials only.
#
# Production clusters must NOT use this file. Replace it with an ExternalSecret (External Secrets
# Operator), a SealedSecret (Sealed Secrets) or a CSI secret store, and rotate
# SOVMESTIM_JWT_SECRET so identity and gateway receive the same random value.
apiVersion: v1
kind: Secret
metadata:
  name: sovmestim-secrets
  labels:
    app.kubernetes.io/part-of: sovmestim
  annotations:
    sovmestim.io/development-only: "true"
type: Opaque
stringData:
  POSTGRES_USER: sovmestim
  POSTGRES_PASSWORD: change-me-in-production
  SOVMESTIM_JWT_SECRET: dev-only-secret-change-me-0123456789abcdef
  SPRING_MAIL_USERNAME: ""
  SPRING_MAIL_PASSWORD: ""
  SOVMESTIM_RLS_API_KEY: ""
