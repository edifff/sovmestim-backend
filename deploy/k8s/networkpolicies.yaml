# Network segmentation: deny everything, then allow only the calls the architecture needs.
#
#   gateway  -> identity, patient, catalog, intake, advice (gRPC) + its own database
#   advice   -> catalog, patient, intake (snapshot + recheck) + its own database
#   intake   -> catalog (medicine resolution) + its own database
#   each app -> its own database (no service can read another service's database)
#
# Database pods have no egress at all (the DNS policy still applies to them, which is harmless).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# ---------------------------------------------------------------- database ingress
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db-identity-ingress
spec:
  podSelector:
    matchLabels:
      app: db-identity
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: identity
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db-patient-ingress
spec:
  podSelector:
    matchLabels:
      app: db-patient
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: patient
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db-catalog-ingress
spec:
  podSelector:
    matchLabels:
      app: db-catalog
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: catalog
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db-intake-ingress
spec:
  podSelector:
    matchLabels:
      app: db-intake
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: intake
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db-advice-ingress
spec:
  podSelector:
    matchLabels:
      app: db-advice
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: advice
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db-gateway-ingress
spec:
  podSelector:
    matchLabels:
      app: db-gateway
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: gateway
      ports:
        - protocol: TCP
          port: 5432
---
# ---------------------------------------------------------------- service policies
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: identity-policy
spec:
  podSelector:
    matchLabels:
      app: identity
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: gateway
      ports:
        - protocol: TCP
          port: 9091
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: db-identity
      ports:
        - protocol: TCP
          port: 5432
    # SMTP delivery for OTP codes. Remove when sovmestim.otp.channel=log.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 587
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: patient-policy
spec:
  podSelector:
    matchLabels:
      app: patient
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: gateway
        - podSelector:
            matchLabels:
              app: advice
      ports:
        - protocol: TCP
          port: 9092
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: db-patient
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: catalog-policy
spec:
  podSelector:
    matchLabels:
      app: catalog
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: gateway
        - podSelector:
            matchLabels:
              app: intake
        - podSelector:
            matchLabels:
              app: advice
      ports:
        - protocol: TCP
          port: 9093
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: db-catalog
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: intake-policy
spec:
  podSelector:
    matchLabels:
      app: intake
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: gateway
        - podSelector:
            matchLabels:
              app: advice
      ports:
        - protocol: TCP
          port: 9094
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: db-intake
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: catalog
      ports:
        - protocol: TCP
          port: 9093
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: advice-policy
spec:
  podSelector:
    matchLabels:
      app: advice
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: gateway
      ports:
        - protocol: TCP
          port: 9095
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: db-advice
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: catalog
      ports:
        - protocol: TCP
          port: 9093
    - to:
        - podSelector:
            matchLabels:
              app: patient
      ports:
        - protocol: TCP
          port: 9092
    - to:
        - podSelector:
            matchLabels:
              app: intake
      ports:
        - protocol: TCP
          port: 9094
    # Licensed RLS API. Remove when sovmestim.rls.mode=demo.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-policy
spec:
  podSelector:
    matchLabels:
      app: gateway
  policyTypes: ["Ingress", "Egress"]
  ingress:
    # Public REST entry point. Restrict `from` to the ingress-controller namespace in production.
    - ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: db-gateway
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: identity
      ports:
        - protocol: TCP
          port: 9091
    - to:
        - podSelector:
            matchLabels:
              app: patient
      ports:
        - protocol: TCP
          port: 9092
    - to:
        - podSelector:
            matchLabels:
              app: catalog
      ports:
        - protocol: TCP
          port: 9093
    - to:
        - podSelector:
            matchLabels:
              app: intake
      ports:
        - protocol: TCP
          port: 9094
    - to:
        - podSelector:
            matchLabels:
              app: advice
      ports:
        - protocol: TCP
          port: 9095
