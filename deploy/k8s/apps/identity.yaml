apiVersion: v1
kind: ServiceAccount
metadata:
  name: identity
  labels:
    app: identity
    app.kubernetes.io/part-of: sovmestim
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: identity
  labels:
    app: identity
    app.kubernetes.io/part-of: sovmestim
    app.kubernetes.io/component: service
spec:
  type: ClusterIP
  selector:
    app: identity
  ports:
    - name: http
      port: 8081
      targetPort: http
    - name: grpc
      port: 9091
      targetPort: grpc
      appProtocol: grpc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity
  labels:
    app: identity
    app.kubernetes.io/part-of: sovmestim
    app.kubernetes.io/component: service
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: identity
  template:
    metadata:
      labels:
        app: identity
        app.kubernetes.io/name: identity
        app.kubernetes.io/part-of: sovmestim
    spec:
      serviceAccountName: identity
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: identity
          image: sovmestim-identity:0.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
            - name: grpc
              containerPort: 9091
          envFrom:
            - configMapRef:
                name: identity-config
          env:
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: sovmestim-secrets
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sovmestim-secrets
                  key: POSTGRES_PASSWORD
            - name: SOVMESTIM_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sovmestim-secrets
                  key: SOVMESTIM_JWT_SECRET
            - name: SPRING_MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: sovmestim-secrets
                  key: SPRING_MAIL_USERNAME
            - name: SPRING_MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sovmestim-secrets
                  key: SPRING_MAIL_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
