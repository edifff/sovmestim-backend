apiVersion: v1
kind: Service
metadata:
  name: db-identity
  labels:
    app: db-identity
    app.kubernetes.io/part-of: sovmestim
    app.kubernetes.io/component: database
spec:
  clusterIP: None
  selector:
    app: db-identity
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db-identity
  labels:
    app: db-identity
    app.kubernetes.io/part-of: sovmestim
    app.kubernetes.io/component: database
spec:
  serviceName: db-identity
  replicas: 1
  selector:
    matchLabels:
      app: db-identity
  template:
    metadata:
      labels:
        app: db-identity
        app.kubernetes.io/part-of: sovmestim
        app.kubernetes.io/component: database
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: sovmestim_identity
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: sovmestim-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sovmestim-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # readOnlyRootFilesystem is intentionally not set: PostgreSQL writes its socket to
          # /var/run/postgresql. Capabilities are still dropped and the container is non-root.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
